    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* --- Animasi Awan --- */
        @keyframes drift {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(110vw); }
        }

        .cloud {
            position: absolute;
            transition: all 1s ease-in-out;
        }

        /* Konfigurasi kecepatan, ukuran, dan posisi awan */
        .cloud-1 { top: 8%; width: 140px; animation: drift 40s linear infinite; left: -150px; }
        .cloud-2 { top: 22%; width: 220px; animation: drift 55s linear infinite 8s; left: -250px; }
        .cloud-3 { top: 38%; width: 130px; animation: drift 30s linear infinite 3s; left: -150px; }
        .cloud-4 { top: 60%; width: 180px; animation: drift 48s linear infinite 15s; left: -200px; }
        .cloud-5 { top: 78%; width: 260px; animation: drift 65s linear infinite 1s; left: -300px; }
        
        /* --- Animasi Bintang Kelap-kelip --- */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite ease-in-out;
        }
    </style>
</head>

    <!-- Script Logika Toggle Tema -->
    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        // Cek LocalStorage untuk melihat apakah user pernah mengatur tema sebelumnya
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        themeToggleBtn.addEventListener('click', function() {
            // Toggle class 'dark' pada HTML
            htmlElement.classList.toggle('dark');

            // Simpan preferensi di LocalStorage
            if (htmlElement.classList.contains('dark')) {
                localStorage.setItem('color-theme', 'dark');
            } else {
                localStorage.setItem('color-theme', 'light');
            }
        });
    </script>
